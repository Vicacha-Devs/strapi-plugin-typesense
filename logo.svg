<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Decorative Grid & Orbit lines -->
  <circle cx="230" cy="230" r="140" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="230" cy="230" r="90" stroke="#475569" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Magnifying Glass Lens Outer -->
  <circle cx="220" cy="220" r="105" stroke="url(#iconGrad)" stroke-width="28" fill="none" filter="url(#glow)"/>

  <!-- Handle -->
  <line x1="300" y1="300" x2="410" y2="410" stroke="url(#iconGrad)" stroke-width="32" stroke-linecap="round" filter="url(#glow)"/>

  <!-- AI Vector Nodes inside Lens -->
  <circle cx="170" cy="180" r="14" fill="#a78bfa"/>
  <circle cx="260" cy="160" r="12" fill="#38bdf8"/>
  <circle cx="230" cy="250" r="16" fill="#818cf8"/>
  <circle cx="160" cy="245" r="10" fill="#34d399"/>

  <!-- Connecting Vector Edges -->
  <line x1="170" y1="180" x2="260" y2="160" stroke="#a78bfa" stroke-width="4" opacity="0.8"/>
  <line x1="170" y1="180" x2="230" y2="250" stroke="#818cf8" stroke-width="4" opacity="0.8"/>
  <line x1="260" y1="160" x2="230" y2="250" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>
  <line x1="170" y1="180" x2="160" y2="245" stroke="#34d399" stroke-width="3" opacity="0.7"/>
  <line x1="160" y1="245" x2="230" y2="250" stroke="#34d399" stroke-width="3" opacity="0.7"/>
</svg>
